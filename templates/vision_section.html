{% extends "layout.html" %}
{% block content %}
<div class="container mt-4">
  <h2>Vision Section</h2>
  <form method="POST" enctype="multipart/form-data">
    <div class="mb-3">
      <label class="form-label">Judul</label>
      <input type="text" class="form-control" name="title" value="{{ vision.title if vision else '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Deskripsi</label>
      <textarea class="form-control" name="description">{{ vision.description if vision else '' }}</textarea>
    </div>
    {% if vision and vision.image_url %}
      <div class="mb-3">
        <img src="/{{ vision.image_url }}" alt="Vision Image" class="img-thumbnail" style="max-width: 200px;">
      </div>
    {% endif %}
    <div class="mb-3">
      <label class="form-label">Upload Gambar</label>
      <input type="file" class="form-control" name="image">
    </div>
    <button type="submit" class="btn btn-primary">Simpan</button>
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Kembali</a>
  </form>
</div>
{% endblock %}

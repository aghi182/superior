{% extends "layout.html" %}
{% block content %}
<div class="container mt-4">
  <h2>About Section</h2>
  <form method="POST" enctype="multipart/form-data">
    <!-- Judul -->
    <div class="mb-3">
      <label class="form-label">Judul</label>
      <input type="text" class="form-control" name="title" value="{{ about.title if about else '' }}">
    </div>

    <!-- Deskripsi -->
    <div class="mb-3">
      <label class="form-label">Deskripsi</label>
      <textarea class="form-control" name="description" rows="5">{{ about.description if about else '' }}</textarea>
    </div>

    <!-- Gambar -->
    <div class="mb-3">
      <label class="form-label">Gambar Company Profile</label>
      <input type="file" class="form-control" name="image" accept="image/*">

      {% if about and about.images %}
  <div class="mt-3">
    <p class="text-muted mb-1">Gambar saat ini:</p>
    <img src="{{ url_for('pictures', filename=about.images) }}"
         alt="Current About Image"
         class="img-thumbnail shadow-sm rounded"
         style="max-height: 200px;">
  </div>
{% endif %}
    </div>

    <!-- Tombol -->
    <div class="d-flex justify-content-between mt-4">
      <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Kembali</a>
      <button type="submit" class="btn btn-primary">Simpan</button>
    </div>
  </form>
</div>
{% endblock %}
